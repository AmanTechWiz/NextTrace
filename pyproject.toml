[project]
name = "nexttrace"
version = "0.1.0"
description = "Finds which service failed first, who it hurts, and what fixed it last time, using a FalkorDB graph."
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
